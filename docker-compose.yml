services:
  frontend:
    image: node:22
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/api/games') === false ? 1 : 0);"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gamevers
      MYSQL_USER: gamevers
      MYSQL_PASSWORD: gamevers_password
      MYSQL_ROOT_PASSWORD: gamevers_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  frontend_modules:
  mysql_data:
